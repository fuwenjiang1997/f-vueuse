<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42b883"/>
      <stop offset="100%" stop-color="#35495e"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="35" fill="url(#bgGrad)"/>

  <!-- Inner highlight ring -->
  <rect x="25" y="25" width="150" height="150" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Letter "f" -->
  <text x="100" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" fill="#ffffff" text-anchor="middle">f</text>

  <!-- Vue leaf accent -->
  <path d="M160 50 Q175 60 170 80 L165 75 Q168 62 158 55 Z" fill="#42b883"/>
  <path d="M165 55 Q180 65 175 85 L170 80 Q173 67 163 60 Z" fill="#35d68c"/>

  <!-- Composition dots pattern -->
  <circle cx="50" cy="60" r="5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="65" cy="50" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="55" cy="75" r="4" fill="rgba(255,255,255,0.3)"/>

  <circle cx="135" cy="140" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="150" cy="150" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="145" cy="130" r="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>
